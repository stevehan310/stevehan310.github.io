<!-- MathJax for rendering math in posts. kramdown turns block $$...$$ into \[...\] and
     leaves inline $...$ as-is, so both delimiter forms need to be registered here. -->
<script>
  MathJax = {
    tex: {
      inlineMath: [['\\(', '\\)'], ['$', '$']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']]
    }
  };
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
